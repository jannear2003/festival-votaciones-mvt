{% extends "base.html" %}

{% block title %}Contraseña actualizada{% endblock %}

{% block content %}
<section class="login card password-recovery">
  <p class="eyebrow dark">Recuperación completada</p>

  <h1>Contraseña actualizada</h1>

  <div class="notice" role="status">
    Tu contraseña fue actualizada correctamente. Ya puedes
    iniciar sesión con la nueva contraseña.
  </div>

  <div class="actions">
    <a class="btn" href="{% url 'login' %}">
      Iniciar sesión
    </a>
  </div>
</section>
{% endblock %}
