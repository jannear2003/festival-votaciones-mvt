{% extends "base.html" %}
{% block title %}Iniciar sesion{% endblock %}
{% block content %}
<section class="login card">
  <h1>Iniciar sesion</h1>
  {% if form.errors %}<p class="error" role="alert">Usuario o contrasena incorrectos.</p>{% endif %}
  <form id="login-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="btn" type="submit">Ingresar</button>
  </form>
  <p>No tiene una cuenta? <a href="{% url 'elecciones:registro' %}">Registrarse</a></p>
</section>
{% endblock %}
